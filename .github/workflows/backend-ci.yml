name: Backend CI (PostgreSQL 16 + pgvector)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: intel_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies
        working-directory: backend
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"

      - name: Run Alembic Migration on Real PostgreSQL 16
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/intel_os_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run Full Test Suite (Unit + PostgreSQL 16 Integration)
        working-directory: backend
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/intel_os_test
        run: |
          uv run pytest -v --cov=intel_os
