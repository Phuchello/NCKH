services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intel_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: intel_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intel_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
